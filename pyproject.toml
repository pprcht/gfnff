[build-system]
# scikit-build-core drives the CMake build and packages the resulting
# shared library into the wheel together with the Python sources.
requires = ["scikit-build-core>=0.9", "cmake>=3.21"]
build-backend = "scikit_build_core.build"

[project]
name = "gfnff"
version = "0.3.0"
description = "Python bindings for the GFN-FF force-field library"
readme = "README.md"
authors = [{ name = "Philipp Pracht", email="research@philipp-pracht.de" }]
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
keywords = ["force field", "GFN-FF", "computational chemistry"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Fortran",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Homepage = "https://github.com/pprcht/gfnff"
Repository ="https://github.com/pprcht/gfnff"

[project.optional-dependencies]
ase = ["ase>=3.22"]
test = ["pytest>=7", "ase>=3.22"]
docs = ["sphinx>=8.2.3", "shibuya", "myst-parser", "sphinx-argparse", "ase>=3.22"]

[project.scripts]
gfnff = "gfnff.cli:main"

[tool.scikit-build]
# Pass -DPYTHON_BINDINGS=ON so the shared library target is built and installed
# into the python/gfnff/ directory, where ctypes will find it at import time.
cmake.build-type = "Release"
cmake.args = ["-DPYTHON_BINDINGS=ON", "-DWITH_TESTS=OFF"]
# python/gfnff/ is the importable package; scikit-build-core includes it in
# the wheel alongside any files placed there by the CMake install step.
wheel.packages = ["python/gfnff"]
# The bindings are pure ctypes, there is no CPython extension module. One
# py3-none-<platform> wheel per platform therefore serves every Python version.
wheel.py-api = "py3"

[tool.scikit-build.cmake.define]
WITH_OpenMP = "ON"

# Wheel builds. Kept here rather than in the workflow so that a local
# `cibuildwheel --only cp313-manylinux_x86_64` does exactly what CI does.
[tool.cibuildwheel]
# The wheel is built once per platform (see wheel.py-api) and reused; listing
# two interpreters runs the test suite on the oldest and a recent Python.
build = ["cp39-*", "cp313-*"]
skip = ["*-musllinux*"]
# Only the tests and the parameter files are copied next to the installed
# wheel, so `import gfnff` cannot pick up the source tree instead of it.
test-sources = ["python/tests", "param"]
test-extras = ["test"]
test-command = [
  # the TOML tests skip without toml-f, so require it explicitly
  'python -c "from gfnff._lib import toml_available; assert toml_available()"',
  "pytest python/tests",
]

[tool.cibuildwheel.linux]
# Default manylinux_2_28 image (AlmaLinux 8, glibc 2.28). It ships gfortran,
# and current NumPy has no wheels for anything older, so the tests need it.
before-all = "dnf install -y openblas-devel"
environment = { FC = "gfortran", CMAKE_BUILD_PARALLEL_LEVEL = "4" }

[tool.cibuildwheel.macos]
environment = { FC = "gfortran", MACOSX_DEPLOYMENT_TARGET = "14.0", CMAKE_BUILD_PARALLEL_LEVEL = "4" }
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
