# This file is part of gfnff.
# SPDX-Identifier: LGPL-3.0-or-later
#
# Build binary wheels and an sdist for PyPI.
# Triggered on version tags (v*) or manually via workflow_dispatch.
#
# The cibuildwheel settings (interpreters, container setup, test command) live
# in pyproject.toml under [tool.cibuildwheel], so a local cibuildwheel run
# builds and tests exactly what this workflow does.
#
# Every wheel is installed into a clean environment and run against
# python/tests before anything is uploaded; a test failure blocks the release.
#
# The bindings are pure ctypes, so there is one py3-none wheel per platform.
#
# Platform coverage:
#   Linux  x86_64   : ubuntu-latest runner, manylinux_2_28
#   Linux  aarch64  : ubuntu-24.04-arm runner (native, no QEMU)
#   macOS  arm64    : macos-14 runner (Apple Silicon, Homebrew gfortran)
#   Windows         : not yet supported (requires mingw-w64 gfortran in CI)
#
# OpenMP note:
#   find_package(OpenMP) in CMakeLists.txt is intentionally non-fatal.
#   On macOS, Apple Clang (C/CXX) has no native OpenMP; Homebrew gfortran
#   does.  CMake detects OpenMP_Fortran_FOUND and enables it for Fortran only.
#
# Dependency bundling:
#   Linux  : auditwheel repair (run automatically by cibuildwheel) bundles
#            libgfortran.so and libgomp.so into the wheel.
#   macOS  : delocate bundles Homebrew gfortran runtime dylibs.
#
# macOS runner pinned to macos-14:
#   Homebrew compiles gcc dylibs against the host OS.  On macOS 15 (macos-latest)
#   the dylibs carry minOS=15.0, which delocate-wheel rejects for a 14.0 wheel.
#   macos-14 produces dylibs with minOS=14.0, matching MACOSX_DEPLOYMENT_TARGET.
#
# Linux aarch64 runner:
#   QEMU emulation on x86_64 is 10-20x slower than native.  ubuntu-24.04-arm
#   provides a native arm64 runner (free for public repos).

name: Build wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archs: x86_64
          - os: ubuntu-24.04-arm
            archs: aarch64
          - os: macos-14
            archs: arm64

    steps:
      - uses: actions/checkout@v5

      - name: Install gfortran (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install gcc
          # Homebrew installs gfortran as gfortran-NN; find the highest version
          # and symlink it to a plain 'gfortran' name for CMake to discover.
          GFORTRANS=$(ls "$(brew --prefix)"/bin/gfortran-[0-9]* 2>/dev/null || true)
          if [ -z "$GFORTRANS" ]; then
            echo "No gfortran-* binary found after brew install gcc" >&2; exit 1
          fi
          GFORTRAN_BIN=$(printf '%s\n' $GFORTRANS | sort -t- -k2,2n | tail -n1)
          echo "Using Fortran compiler: $GFORTRAN_BIN"
          ln -sf "$GFORTRAN_BIN" "$(brew --prefix)/bin/gfortran"

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.3.0
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Source distribution: built, then installed from the tarball and tested, so
  # that `pip install --no-binary gfnff` is known to work before it is uploaded
  # ---------------------------------------------------------------------------
  build_sdist:
    name: Build and test sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install compiler and BLAS/LAPACK
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenblas-dev

      - name: Build sdist
        run: pipx run build --sdist

      - name: Install from sdist and test
        run: |
          python -m venv venv
          venv/bin/pip install "$(ls dist/*.tar.gz)[test]"
          # run the tests from a copy, away from the source tree, so that
          # `import gfnff` resolves to the installed package
          mkdir sdist-test
          cp -r --parents python/tests param sdist-test/
          cd sdist-test
          ../venv/bin/python -c "from gfnff._lib import toml_available; assert toml_available()"
          ../venv/bin/pytest python/tests

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Upload to TestPyPI on manual workflow_dispatch (any branch, no tag needed)
  # ---------------------------------------------------------------------------
  upload_testpypi:
    name: Upload to TestPyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/gfnff
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # a dry run may be repeated for the same version
          skip-existing: true

  # ---------------------------------------------------------------------------
  # Collect all wheels and the sdist and upload to PyPI on tagged releases
  # ---------------------------------------------------------------------------
  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/gfnff
    permissions:
      id-token: write  # OIDC trusted publishing
      contents: write  # needed to create a GitHub Release

    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/* --generate-notes --repo ${{ github.repository }}
